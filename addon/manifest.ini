name = outspoken
summary = "MacinTalk (outSPOKEN, 1984)"
description = """The speech engine that introduced the Macintosh in January 1984, written by Joseph Katz and Mark Barton, run as real 68000 code under the Musashi CPU emulator inside NVDA's own process.

This add-on contains no part of the engine. Extract DRVR 1030, TALK 1001 and RULZ 1129 from your own copy of outSPOKEN into the ROM folder; the tools/extract_rom.py script in the project repository will do it from a disk image. On first run the add-on offers to open that folder for you.

English text is converted to phonemes by an interpreter written for this project, reading the letter-to-sound rules out of your own RULZ resource -- the engine itself accepts phonemes only.

The same engine, 67.8% byte-identical, shipped as the Amiga's narrator.device. Two voices, male and female, differing in pitch."""
author = "Joseph Katz and Mark Barton (engine, 1984) -- NVDA driver: tgeczy"
url = "https://github.com/tgeczy/outspoken-nvda"
version = 0.1.0
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.1
