name = outspoken
summary = "MacinTalk (1984, MacinTalk 2, MacinTalk 3 and MacinTalk Pro)"
description = """Macintosh speech engines run as real 68000 code under the Musashi CPU emulator, inside NVDA's own process.

MacinTalk (1984), by Joseph Katz and Mark Barton, is the engine that introduced the Macintosh. Two voices, male and female. The same engine, 67.8% byte-identical, later shipped as the Amiga's narrator.device.

MacinTalk 2 (Apple, 1992) adds ten more: Ben, Boris, Brenda, Mariel, Marvin, Mr. Hughes, Otis, RoboVox, Votron and Xero.

MacinTalk Pro (Apple, 1993) adds Agnes, Bruce and Victoria -- the first concatenative Macintosh voices, and the ones System 7 users will remember. Pro needs a 68020 and reads its 573 KB lexicon out of its own file as it speaks.

MacinTalk 3 (Apple, 1994) adds nineteen: Fred, Kathy, Princess, Junior, Ralph, Albert, Whisper, Zarvox, Trinoids and the singing ones -- Bells, Cellos, Pipe Organ, Good News, Bad News, Boing, Bubbles, Bahh, Deranged and Hysterical. This is the real 68k build rather than a port of it, so it is the engine as it behaved in 1994. It needs a 68040.

As far as we can establish, none of MacinTalk 2's voices, MacinTalk 3's or MacinTalk Pro's have run outside a Macintosh before.

Whichever engines you have extracted are the ones offered, so any one of them alone is enough.

This add-on contains no part of any engine. You supply them from your own copy, and there is a tool for that in the Tools menu: point it at a Macintosh disk image, or at outSPOKEN itself, and it installs what it finds. Nothing else is needed -- no Python and no unpacking software -- and nothing is downloaded. It lists MacinTalk 1, 2, 3 and Pro separately, so you can see what you have and what you are missing.
"""
author = "Joseph Katz and Mark Barton (engine, 1984) -- NVDA driver: tgeczy"
url = "https://github.com/tgeczy/outspoken-nvda"
