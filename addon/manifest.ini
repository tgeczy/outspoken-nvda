name = outspoken
summary = "MacinTalk (1984 and MacinTalk 2)"
description = """Macintosh speech engines run as real 68000 code under the Musashi CPU emulator, inside NVDA's own process.

MacinTalk (1984), by Joseph Katz and Mark Barton, is the engine that introduced the Macintosh. Two voices, male and female. The same engine, 67.8% byte-identical, later shipped as the Amiga's narrator.device.

MacinTalk 2 (Apple, 1992) adds ten more: Ben, Boris, Brenda, Mariel, Marvin, Mr. Hughes, Otis, RoboVox, Votron and Xero. These have not been available outside a Macintosh before.

Whichever engines you have extracted are the ones offered, so either alone is enough.

This add-on contains no part of any engine. You supply them from your own copy; tools/extract_rom.py in the project repository pulls everything out of a disk image, and the add-on offers to open the folder they go in.

MacinTalk 3 is deliberately not included: a native NVDA add-on already builds that engine from Apple's own source, and emulating it would be worse."""
author = "Joseph Katz and Mark Barton (engine, 1984) -- NVDA driver: tgeczy"
url = "https://github.com/tgeczy/outspoken-nvda"
version = 0.6.2
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.1
